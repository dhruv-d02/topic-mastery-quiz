<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Android Mastery 50</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky progress header; course map rail (left) + one lesson card at a time (right); rail stacks above on phones */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --ink: #18202c;
  --ink-2: #4a5568;
  --line: #d5dbe5;
  --accent: #1f5fad;
  --accent-soft: #e2ecf8;
  --gotcha: #a85410;
  --gotcha-soft: #fbefe2;
  --ok: #1d7a46;
  --ok-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --code-bg: #f7f8fb;
  --code-ink: #222a36;
  --k: #7a3fb0; --s: #1d7a46; --c: #7b8494; --a: #a85410; --n: #1f5fad; --t: #0f6f80;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #181e27; --surface-2: #212834; --ink: #e6eaf0; --ink-2: #a3adbd; --line: #2e3746;
    --accent: #7fb0f0; --accent-soft: #1d2b40; --gotcha: #f0a865; --gotcha-soft: #33251a;
    --ok: #6fd39a; --ok-soft: #17301f; --bad: #f2897f; --bad-soft: #3a1d1b;
    --code-bg: #0d1117; --code-ink: #dbe2ec;
    --k: #c79bf2; --s: #7fd6a0; --c: #7d8797; --a: #f0a865; --n: #7fb0f0; --t: #6cd0de;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #181e27; --surface-2: #212834; --ink: #e6eaf0; --ink-2: #a3adbd; --line: #2e3746;
  --accent: #7fb0f0; --accent-soft: #1d2b40; --gotcha: #f0a865; --gotcha-soft: #33251a;
  --ok: #6fd39a; --ok-soft: #17301f; --bad: #f2897f; --bad-soft: #3a1d1b;
  --code-bg: #0d1117; --code-ink: #dbe2ec;
  --k: #c79bf2; --s: #7fd6a0; --c: #7d8797; --a: #f0a865; --n: #7fb0f0; --t: #6cd0de;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: 0.8rem; color: var(--ink-2); }
.progress { flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.progress-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .3s ease; }
.bar .b-ok { background: var(--ok); }
.bar .b-bad { background: var(--bad); }
.top-actions { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 0.875rem; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }

.layout { max-width: 1180px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 20px; max-height: calc(100vh - 110px); overflow: auto; padding-right: 4px; }
.rail-toggle { display: none; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 4px; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-row { display: flex; flex-direction: column; gap: 4px; }
.stack-row small { font-size: 0.72rem; color: var(--ink-2); }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); font-size: 0.66rem; font-family: var(--font-mono); padding: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.cell.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.cell.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.dim { opacity: .3; }
.modules { display: flex; flex-direction: column; gap: 2px; }
.modules button { display: flex; justify-content: space-between; gap: 8px; align-items: center; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 0.86rem; }
.modules button:hover { background: var(--surface-2); }
.modules button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.modules em { font-style: normal; font-size: 0.75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mode-note { font-size: 0.8rem; color: var(--ink-2); background: var(--surface-2); padding: 8px 10px; border-radius: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px clamp(18px, 4vw, 36px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--ink-2); }
.qno { font-family: var(--font-mono); font-weight: 600; color: var(--ink); }
.pill { border-radius: 99px; padding: 2px 10px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); }
.pill.easy { color: var(--ok); border-color: currentColor; }
.pill.medium { color: var(--accent); border-color: currentColor; }
.pill.hard { color: var(--gotcha); border-color: currentColor; }
.concept { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.015em; }
.summary { max-width: 68ch; margin: 0; }
.keypoints { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.keypoints li::marker { color: var(--accent); }

.code { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-2); }
.code-head button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 10px; font-size: 0.75rem; }
.code pre { margin: 0; padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.55; color: var(--code-ink); tab-size: 4; }
.tk-k { color: var(--k); font-weight: 600; } .tk-s { color: var(--s); } .tk-c { color: var(--c); font-style: italic; } .tk-a { color: var(--a); } .tk-n { color: var(--n); } .tk-t { color: var(--t); }

.divider { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.question { font-size: 1.08rem; font-weight: 600; margin: 0; max-width: 70ch; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 11px 14px; transition: border-color .15s, background .15s; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt b { font-family: var(--font-mono); flex: none; width: 1.6em; height: 1.6em; border-radius: 5px; display: grid; place-items: center; font-size: 0.78rem; background: var(--surface-2); }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct b { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong b { background: var(--bad); color: var(--surface); }
.opt.muted { opacity: .62; }

.feedback { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
.verdict { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.fb-block h3 { font-family: var(--font-body); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.fb-block p { margin: 0; max-width: 70ch; }
.why-wrong { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.why-wrong li { display: flex; gap: 10px; max-width: 70ch; }
.why-wrong code { font-family: var(--font-mono); font-weight: 600; color: var(--bad); flex: none; }
.gotcha { background: var(--gotcha-soft); border-radius: 8px; padding: 12px 14px; }
.gotcha h3 { color: var(--gotcha); }
.recap { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-weight: 600; }

.nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 0.75rem; color: var(--ink-2); }
kbd { font-family: var(--font-mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

.big { font-family: var(--font-display); font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 0.4em; color: var(--ink-2); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
.stat strong { display: block; font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8rem; color: var(--ink-2); }
.mod-bars { display: flex; flex-direction: column; gap: 10px; }
.mod-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 0.86rem; }
.mod-bar .bar { grid-column: 1 / -1; }
.mod-bar em { font-style: normal; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wrong-list { display: flex; flex-wrap: wrap; gap: 8px; }
.wrong-list button { border: 1px solid var(--bad); color: var(--bad); background: var(--bad-soft); border-radius: 99px; padding: 4px 12px; font-size: 0.82rem; }
.sheet { display: flex; flex-direction: column; gap: 16px; }
.sheet h3 { font-size: 1rem; margin-bottom: 6px; }
.sheet ol { margin: 0; padding-left: 2.6em; display: flex; flex-direction: column; gap: 4px; }
.sheet li { max-width: 72ch; }
.sheet li::marker { font-family: var(--font-mono); font-size: 0.8em; color: var(--ink-2); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 40px; }
  .rail { position: static; max-height: none; overflow: visible; padding-right: 0; }
  .rail-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
  .rail-body { display: none; flex-direction: column; gap: 20px; }
  .rail.open .rail-body { display: flex; }
  .card { padding: 20px 16px; }
  .hint { display: none; }
}
@media (min-width: 901px) { .rail-body { display: flex; flex-direction: column; gap: 20px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Android Mastery</h1>
      <span>Experienced level · Kotlin · 50 lessons</span>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-row"><span id="progText">0 / 50 answered</span><span id="scoreText">Score 0</span></div>
      <div class="bar" aria-hidden="true"><i class="b-ok" id="barOk" style="width:0"></i><i class="b-bad" id="barBad" style="width:0"></i></div>
    </div>
    <div class="top-actions">
      <button class="btn" id="resultsBtn" type="button">Results</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="rail" id="rail">
    <button class="rail-toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="railBody"><span>Course map</span><span id="railToggleMeta"></span></button>
    <div class="rail-body" id="railBody">
      <div>
        <p class="label">Difficulty</p>
        <div class="seg" role="group" aria-label="Filter by difficulty" id="seg"></div>
      </div>
      <div id="modeNote" class="mode-note" hidden></div>
      <div>
        <p class="label">Back stack</p>
        <div class="stack" id="stack"></div>
      </div>
      <div>
        <p class="label">Modules</p>
        <div class="modules" id="modules"></div>
      </div>
    </div>
  </aside>
  <main id="main" class="card" tabindex="-1"></main>
</div>

<script>
const ITEMS = [];
ITEMS.push(
{
  id: 1, difficulty: `easy`, module: `App Fundamentals`,
  concept: `The four app components`,
  summary: `The Android OS only knows about a small set of building blocks it can create and start on your behalf. An Activity is a single screen the user interacts with. A Service does work without a UI. A BroadcastReceiver reacts to system-wide or app events, such as boot completed or a change in connectivity. A ContentProvider exposes structured data to other apps or processes through a URI-based API. The system instantiates these itself, which is why you never call an Activity constructor. Everything else in your app lives inside one of them.`,
  code: `<!-- AndroidManifest.xml -->
<application android:name=".App">
    <activity android:name=".MainActivity" android:exported="true" />
    <service android:name=".SyncService" android:exported="false" />
    <receiver android:name=".BootReceiver" android:exported="false" />
    <provider
        android:name=".NotesProvider"
        android:authorities="com.example.notes"
        android:exported="false" />
</application>`,
  codeLang: `xml`,
  keyPoints: [`Components are entry points the OS can launch independently.`, `Each must be declared in the manifest (receivers can also be registered at runtime).`, `The OS owns their creation and lifecycle.`],
  question: `Which of these is NOT one of the four Android app components that the system can start directly?`,
  options: [`ContentProvider`, `BroadcastReceiver`, `Fragment`, `Service`],
  correctIndex: 2,
  explanation: `A Fragment is a reusable piece of UI hosted inside an Activity (or another Fragment). The OS never starts a Fragment on its own; your Activity's FragmentManager creates and manages it. The four components are Activity, Service, BroadcastReceiver and ContentProvider.`,
  whyWrong: [`ContentProvider is a component: the OS creates it when another app or process queries its authority.`, `BroadcastReceiver is a component: the OS can instantiate it to deliver an Intent, even if your app isn't running.`, ``, `Service is a component: it can be started or bound by the OS or by other apps.`],
  hiddenFact: `A ContentProvider's onCreate() runs before Application.onCreate(). Libraries used this to auto-initialise themselves without any code from you, which slowed app startup as providers piled up. Jetpack App Startup exists to merge those initialisers into a single provider.`,
  recap: `Four components: Activity, Service, BroadcastReceiver, ContentProvider. Fragments, Views and ViewModels live inside them.`
},
{
  id: 2, difficulty: `easy`, module: `App Fundamentals`,
  concept: `android:exported`,
  summary: `The android:exported attribute decides whether apps other than yours can start a component. A component that should only be used internally should be exported="false". Starting with Android 12 (apps targeting API 31 or higher), any activity, service or receiver that declares an intent-filter must state android:exported explicitly. Older versions silently picked a default, which led to components being exposed by accident.`,
  code: `<activity
    android:name=".ShareReceiverActivity"
    android:exported="true">   <!-- required: has an intent-filter -->
    <intent-filter>
        <action android:name="android.intent.action.SEND" />
        <category android:name="android.intent.category.DEFAULT" />
        <data android:mimeType="text/plain" />
    </intent-filter>
</activity>`,
  codeLang: `xml`,
  keyPoints: [`exported="true" means other apps can launch it.`, `Rule since target API 31: intent-filter means exported must be explicit.`, `Default to false unless another app or the launcher really needs it.`],
  question: `Your app targets API 34. A <service> declares an <intent-filter> but has no android:exported attribute. What happens?`,
  options: [`It defaults to exported="true", as on older versions`, `It defaults to exported="false" without any error`, `The build or install fails until you set the value explicitly`, `Lint shows a warning but the app runs normally`],
  correctIndex: 2,
  explanation: `For apps targeting API 31+, the manifest merger reports an error and Android 12+ devices refuse to install an APK where a component with an intent-filter omits android:exported. Google made the value mandatory so developers consciously decide what they expose.`,
  whyWrong: [`That was the pre-Android 12 behaviour, and it is exactly what the rule was introduced to stop.`, `There is no silent default any more for components with intent-filters.`, ``, `It is a hard error, not just a Lint warning.`],
  hiddenFact: `Before API 31, the implicit default was true whenever a component had any intent-filter and false otherwise. Many apps exposed internal services just because someone added a filter for convenience, which led to real security bugs.`,
  recap: `Target 31+: any component with an intent-filter must declare android:exported explicitly.`
},
{
  id: 3, difficulty: `easy`, module: `App Fundamentals`,
  concept: `Explicit vs implicit intents`,
  summary: `An Intent is a message asking the system to do something. An explicit intent names the exact component class, which is how you navigate within your own app. An implicit intent describes an action and data, such as "view this URL", and the system finds apps whose intent-filters match. If several apps match and none is the default, the user gets a chooser.`,
  code: `// Explicit: a specific class in my app
startActivity(Intent(this, DetailActivity::class.java))

// Implicit: describe what you want, let the system resolve it
val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://developer.android.com"))
try {
    startActivity(intent)
} catch (e: ActivityNotFoundException) {
    showToast("No app can open this link")
}`,
  codeLang: `kotlin`,
  keyPoints: [`Explicit = target class known; implicit = action + data.`, `Implicit intents are resolved against other apps' intent-filters.`, `Always handle the case where no app can handle the intent.`],
  question: `You want to open a web URL in whichever browser the user prefers. Which Intent should you use?`,
  options: [`Intent(this, BrowserActivity::class.java) with the URL as an extra`, `Intent(Intent.ACTION_VIEW, Uri.parse(url))`, `Intent("android.intent.action.MAIN") with the URL as data`, `sendBroadcast() with an Intent containing the URL`],
  correctIndex: 1,
  explanation: `ACTION_VIEW with an http(s) URI is an implicit intent that every browser registers for. The system resolves it to the user's default browser or shows a chooser.`,
  whyWrong: [`That is an explicit intent to a class in your own app; it can't reach another app's browser.`, ``, `ACTION_MAIN means "start as the main entry point" and carries no expected data; browsers don't match it with a URL.`, `Browsers don't listen for broadcasts to open pages; activities are started with startActivity().`],
  hiddenFact: `Since Android 11, package visibility rules hide most other apps from yours. intent.resolveActivity(packageManager) can return null even when a browser is installed unless you declare a matching <queries> element. Calling startActivity() and catching ActivityNotFoundException avoids that trap.`,
  recap: `Explicit intent = specific class; implicit intent = action + data, resolved by the system.`
},
{
  id: 4, difficulty: `easy`, module: `Lifecycle & State`,
  concept: `Activity lifecycle callbacks`,
  summary: `An Activity moves through paired callbacks. onCreate/onDestroy bracket the instance's existence. onStart/onStop bracket the time it is visible. onResume/onPause bracket the time it is in the foreground and receiving input. When one activity launches another, the system interleaves the two activities' callbacks so the user never sees an empty screen between them.`,
  code: `class A : AppCompatActivity() {
    override fun onPause()  { super.onPause();  Log.d("LC", "A.onPause") }
    override fun onStop()   { super.onStop();   Log.d("LC", "A.onStop") }
}

            }
        }
    }
}`,
  codeLang: `kotlin`,
  keyPoints: [`Target 35 on Android 15 → edge-to-edge enforced.`, `Content must handle WindowInsets.`, `Scaffold and Modifier.safeDrawingPadding help in Compose.`],
  question: `After raising targetSdk to 35, a bottom button on Android 15 sits under the gesture navigation bar. What changed?`,
  options: [`A Material Components bug in the button`, `The navigation bar became taller on Android 15`, `Edge-to-edge is now enforced, so the app draws behind system bars and must apply window insets`, `The app theme was reset to the default`],
  correctIndex: 2,
  explanation: `Targeting API 35 makes the window extend under the navigation bar on Android 15 devices. Without inset handling, bottom content is drawn underneath it. Applying navigation-bar or safe-drawing insets fixes it.`,
  whyWrong: [`The button is fine; the window behind it now extends under the bar.`, `Bar sizes didn't change; the app's drawing area did.`, ``, `The theme is unchanged; only window behaviour changed with the target SDK.`],
  hiddenFact: `Android 15 offered a temporary opt-out attribute (windowOptOutEdgeToEdgeEnforcement), but it's deprecated and stops working for apps that target Android 16 (API 36). Calling enableEdgeToEdge() lets older Android versions behave the same way, so you test one layout.`,
  recap: `Target 35 on Android 15 = edge-to-edge by default; handle WindowInsets.`
},
{
  id: 49, difficulty: `hard`, module: `Platform & Security`,
  concept: `Network security configuration`,
  summary: `Since Android 9 (target API 28), plain-text HTTP is blocked by default; only HTTPS is allowed. The Network Security Configuration file lets you change the rules in XML without code: allow cleartext for specific domains, pin certificates, or trust extra certificate authorities. A debug-overrides section applies only to debuggable builds.`,
  code: `<!-- res/xml/network_security_config.xml -->

    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">10.0.2.2</domain>
    </domain-config>
</network-security-config>

<!-- AndroidManifest.xml -->
<application android:networkSecurityConfig="@xml/network_security_config" />`,
  codeLang: `xml`,
  keyPoints: [`Target 28+: cleartext blocked by default.`, `Scope exceptions to specific domains.`, `debug-overrides for debug-only trust settings.`],
  question: `A request to http://10.0.2.2:8080 (your local dev server, from the emulator) fails with "CLEARTEXT communication not permitted". What's the best fix?`,
  options: [`Set android:usesCleartextTraffic="true" for the whole app`, `Allow cleartext only for that domain in a network security config, ideally only in debug builds`, `Disable TLS certificate validation in OkHttp`, `Lower targetSdk below 28`],
  correctIndex: 1,
  explanation: `A domain-scoped exception allows HTTP to the dev server while all other traffic stays HTTPS-only. Putting the config in a debug source set keeps it out of release builds.`,
  whyWrong: [`That enables plain HTTP for every domain, a much wider hole than you need.`, ``, `This doesn't affect cleartext at all and makes HTTPS insecure.`, `Lowering the target SDK isn't possible on Play and gives up other platform protections.`],
  hiddenFact: `Since Android 7.0 (target 24), apps don't trust user-installed CA certificates by default. That's why debugging proxies like Charles or mitmproxy can't see traffic unless the app trusts user CAs in debug-overrides.`,
  recap: `Allow cleartext per domain in a network security config, not app-wide.`
},
{
  id: 50, difficulty: `hard`, module: `Performance & Internals`,
  concept: `Multiple processes`,
  summary: `Components can run in a separate process with the android:process attribute, for example to isolate a crash-prone SDK or a sync service. Each process is a separate Linux process with its own ART instance and memory. When a process starts, Android creates the Application object in it before any component, just as it does for the main process.`,
  code: `<service
    android:name=".SyncService"
    android:process=":sync" />

class App : Application() {

        super.onCreate()
        Analytics.init(this)        // runs in which processes?
        Database.warmUp(this)
    }
}`,
  codeLang: `kotlin`,
  keyPoints: [`android:process = separate memory space.`, `Application.onCreate runs in every process.`, `Singletons are per process, not per app.`],
  question: `What happens when SyncService's :sync process starts?`,
  options: [`A new Application instance is created in that process and onCreate runs again; singletons there are separate copies`, `Only the service is created; the Application class isn't instantiated`, `It shares Kotlin objects and in-memory caches with the main process`, `The app crashes because Application can't be created twice`],
  correctIndex: 0,
  explanation: `Every process of your app gets its own Application instance, so App.onCreate() runs in :sync too. Analytics and Database are initialised again there, and any object in memory is a separate copy that doesn't share state with the main process.`,
  whyWrong: [``, `The Application is always created first in every process.`, `Processes don't share memory; you'd need IPC (Binder, ContentProvider, files) to share state.`, `Creating one Application per process is normal and expected.`],
  hiddenFact: `Duplicate initialisation in extra processes slows them down and can corrupt files or databases that assume a single writer. Application.getProcessName() (API 28+) lets you skip heavy init outside the main process. SharedPreferences' MODE_MULTI_PROCESS is deprecated because it was never reliable across processes.`,
  recap: `Each process gets its own Application and its own singletons.`

</script>
<script>
(function () {
  const STORE_KEY = "android-mastery-50-v1";
  const LEVELS = ["easy", "medium", "hard"];
  const LEVEL_NAME = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const MODULES = [];
  ITEMS.forEach(it => { if (!MODULES.includes(it.module)) MODULES.push(it.module); });
  const byId = Object.fromEntries(ITEMS.map(it => [it.id, it]));

  let state = { answers: {}, current: 1, mode: "all", retryIds: [], view: "item", recapLevel: null };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  if (!byId[state.current]) state.current = 1;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const isCorrect = id => state.answers[id] === byId[id].correctIndex;
  const answered = id => state.answers[id] !== undefined;

  function list() {
    if (state.mode === "all") return ITEMS.map(i => i.id);
    if (LEVELS.includes(state.mode)) return ITEMS.filter(i => i.difficulty === state.mode).map(i => i.id);
    if (state.mode === "retry") return state.retryIds.slice();
    if (state.mode.startsWith("module:")) { const m = state.mode.slice(7); return ITEMS.filter(i => i.module === m).map(i => i.id); }
    return ITEMS.map(i => i.id);
  }

  /* ---------- syntax highlighting ---------- */
  const RULES = {
    kotlin: /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|(@\w+)|\b(fun|val|var|class|object|interface|data|override|suspend|return|if|else|while|for|in|by|private|import|is|try|catch|when|super|this|null|true|false|init|throw|get)\b|(\b\d[\d_]*\b)|(\b[A-Z]\w*)/g,
    xml: /(<!--[\s\S]*?-->)|("[^"]*")|(<\/?[\w.:-]+|\/?>)|([\w:.-]+(?==))/g,
    bash: /(#[^\n]*)|("[^"]*")|\b(adb|shell|am|kill)\b/g,
    text: /(<!--[\s\S]*?-->)/g
  };
  const CLS = {
    kotlin: ["c", "s", "a", "k", "n", "t"],
    xml: ["c", "s", "k", "a"],
    bash: ["c", "s", "k"],
    text: ["c"]
  };
  function highlight(code, lang) {
    const re = RULES[lang] || RULES.text, cls = CLS[lang] || CLS.text;
    re.lastIndex = 0;
    let out = "", last = 0, m;
    while ((m = re.exec(code))) {
      if (m[0] === "") { re.lastIndex++; continue; }
      out += esc(code.slice(last, m.index));
      let g = 1; while (g < m.length && m[g] === undefined) g++;
      out += '<span class="tk-' + cls[g - 1] + '">' + esc(m[0]) + "</span>";
      last = m.index + m[0].length;
    }
    return out + esc(code.slice(last));
  }

  /* ---------- rail ---------- */
  function renderRail() {
    const seg = $("seg");
    seg.innerHTML = ["all", ...LEVELS].map(m =>
      '<button type="button" data-mode="' + m + '" aria-pressed="' + (state.mode === m) + '">' + (m === "all" ? "All" : LEVEL_NAME[m]) + "</button>").join("");

    const inList = new Set(list());
    $("stack").innerHTML = LEVELS.map(lv => {
      const items = ITEMS.filter(i => i.difficulty === lv);
      const got = items.filter(i => isCorrect(i.id)).length, done = items.filter(i => answered(i.id)).length;
      return '<div class="stack-row"><small>' + LEVEL_NAME[lv] + " · Q" + items[0].id + "–" + items[items.length - 1].id +
        " · " + got + "/" + done + ' correct</small><div class="cells">' +
        items.map(i => {
          let c = "cell";
          if (answered(i.id)) c += isCorrect(i.id) ? " ok" : " bad";
          if (state.view === "item" && i.id === state.current) c += " current";
          if (!inList.has(i.id)) c += " dim";
          const st = answered(i.id) ? (isCorrect(i.id) ? "correct" : "wrong") : "not answered";
          return '<button type="button" class="' + c + '" data-go="' + i.id + '" aria-label="Question ' + i.id + ", " + esc(i.concept) + ", " + st + '">' + i.id + "</button>";
        }).join("") + "</div></div>";
    }).join("");

    $("modules").innerHTML = MODULES.map(m => {
      const items = ITEMS.filter(i => i.module === m);
      const got = items.filter(i => isCorrect(i.id)).length;
      return '<button type="button" data-mode="module:' + esc(m) + '" aria-pressed="' + (state.mode === "module:" + m) + '"><span>' + esc(m) + "</span><em>" + got + "/" + items.length + "</em></button>";
    }).join("");

    const note = $("modeNote");
    if (state.mode === "retry") { note.hidden = false; note.innerHTML = "Retry mode: " + state.retryIds.length + (state.retryIds.length === 1 ? " question" : " questions") + " you missed.<button class='btn' type='button' data-mode='all'>Exit</button>"; }
    else if (state.mode.startsWith("module:")) { note.hidden = false; note.textContent = "Showing module: " + state.mode.slice(7); }
    else note.hidden = true;

    const total = ITEMS.length, done = ITEMS.filter(i => answered(i.id)).length, got = ITEMS.filter(i => isCorrect(i.id)).length;
    $("progText").textContent = done + " / " + total + " answered";
    $("scoreText").textContent = "Score " + got + (done ? " (" + Math.round(got / done * 100) + "%)" : "");
    $("barOk").style.width = (got / total * 100) + "%";
    $("barBad").style.width = ((done - got) / total * 100) + "%";
    $("railToggleMeta").textContent = "Q" + state.current + " · " + got + " correct";
  }

  /* ---------- item view ---------- */
  function renderItem() {
    const it = byId[state.current];
    const ids = list(), pos = ids.indexOf(it.id);
    const ans = state.answers[it.id];
    const done = ans !== undefined;
    const letters = ["A", "B", "C", "D"];
    let h = "";
    h += '<div class="meta"><span class="qno">Q' + String(it.id).padStart(2, "0") + '</span><span class="pill ' + it.difficulty + '">' + LEVEL_NAME[it.difficulty] + "</span><span>" + esc(it.module) + "</span>" +
      (pos >= 0 ? "<span>· " + (pos + 1) + " of " + ids.length + "</span>" : "") + "</div>";
    h += '<h2 class="concept">' + esc(it.concept) + "</h2>";
    h += '<p class="summary">' + esc(it.summary) + "</p>";
    if (it.code) {
      h += '<div class="code"><div class="code-head"><span>' + esc(it.codeLang) + '</span><button type="button" data-copy>Copy</button></div><pre><code>' + highlight(it.code, it.codeLang) + "</code></pre></div>";
    }
    h += '<ul class="keypoints">' + it.keyPoints.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul>";
    h += '<div class="divider">Check yourself</div>';
    h += '<p class="question" id="qtext">' + esc(it.question) + "</p>";
    h += '<div class="options" role="group" aria-labelledby="qtext">' + it.options.map((o, i) => {
      let c = "opt";
      if (done) { if (i === it.correctIndex) c += " correct"; else if (i === ans) c += " wrong"; else c += " muted"; }
      return '<button type="button" class="' + c + '" data-opt="' + i + '"' + (done ? " disabled" : "") + "><b>" + letters[i] + "</b><span>" + esc(o) + "</span></button>";
    }).join("") + "</div>";
    if (done) {
      const ok = ans === it.correctIndex;
      h += '<section class="feedback" aria-live="polite">';
      h += '<div class="verdict ' + (ok ? "ok" : "bad") + '">' + (ok ? "Correct." : "Not quite. The answer is " + letters[it.correctIndex] + ".") + "</div>";
      h += '<div class="fb-block"><h3>Why ' + letters[it.correctIndex] + " is right</h3><p>" + esc(it.explanation) + "</p></div>";
      h += '<div class="fb-block"><h3>Why the others are wrong</h3><ul class="why-wrong">' +
        it.whyWrong.map((w, i) => i === it.correctIndex ? "" : "<li><code>" + letters[i] + "</code><span>" + esc(w) + "</span></li>").join("") + "</ul></div>";
      h += '<div class="fb-block gotcha"><h3>Hidden fact</h3><p>' + esc(it.hiddenFact) + "</p></div>";
      h += '<div class="recap">' + esc(it.recap) + "</div>";
      h += "</section>";
    }
    h += '<div class="nav"><button type="button" class="btn" data-nav="prev"' + (pos <= 0 ? " disabled" : "") + '>← Previous</button>' +
      '<span class="hint"><kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>←</kbd><kbd>→</kbd> move</span>' +
      '<button type="button" class="btn primary" data-nav="next">' + nextLabel() + "</button></div>";
    $("main").innerHTML = h;
  }

  function nextLabel() {
    const ids = list(), pos = ids.indexOf(state.current);
    const cur = byId[state.current], nxt = byId[ids[pos + 1]];
    if (!nxt) return state.mode === "all" || LEVELS.includes(state.mode) ? "Finish level →" : "See results →";
    if (nxt.difficulty !== cur.difficulty) return "Finish level →";
    return "Next →";
  }

  function goNext() {
    if (state.view !== "item") return;
    const ids = list(), pos = ids.indexOf(state.current);
    const cur = byId[state.current], nxt = byId[ids[pos + 1]];
    const levelMode = state.mode === "all" || LEVELS.includes(state.mode);
    if (levelMode && (!nxt || nxt.difficulty !== cur.difficulty)) { state.view = "recap"; state.recapLevel = cur.difficulty; }
    else if (!nxt) state.view = "results";
    else state.current = nxt.id;
    update(true);
  }
  function goPrev() {
    if (state.view !== "item") return;
    const ids = list(), pos = ids.indexOf(state.current);
    if (pos > 0) { state.current = ids[pos - 1]; update(true); }
  }

  /* ---------- recap and results ---------- */
  function renderRecap() {
    const lv = state.recapLevel, items = ITEMS.filter(i => i.difficulty === lv);
    const done = items.filter(i => answered(i.id)).length, got = items.filter(i => isCorrect(i.id)).length;
    const nextLv = LEVELS[LEVELS.indexOf(lv) + 1];
    const cont = state.mode === "all" && nextLv;
    let h = '<div class="meta"><span class="pill ' + lv + '">' + LEVEL_NAME[lv] + "</span><span>Level recap</span></div>";
    h += '<h2 class="concept">' + LEVEL_NAME[lv] + " level complete</h2>";
    h += '<div class="big">' + got + "<small> / " + items.length + " correct" + (done < items.length ? " · " + (items.length - done) + " unanswered" : "") + "</small></div>";
    h += '<div class="sheet"><div><h3>What this level taught you</h3><ol>' + items.map(i => '<li value="' + i.id + '">' + esc(i.recap) + "</li>").join("") + "</ol></div></div>";
    h += '<div class="row-actions">' + (cont ? '<button type="button" class="btn primary" data-act="continue">Start ' + LEVEL_NAME[nextLv] + " →</button>" : '<button type="button" class="btn primary" data-act="results">See full results →</button>') +
      '<button type="button" class="btn" data-act="review">Review this level</button></div>';
    $("main").innerHTML = h;
  }

  function renderResults() {
    const done = ITEMS.filter(i => answered(i.id)).length, got = ITEMS.filter(i => isCorrect(i.id)).length;
    const wrong = ITEMS.filter(i => answered(i.id) && !isCorrect(i.id));
    let h = '<div class="meta"><span>Results</span></div><h2 class="concept">Your Android scorecard</h2>';
    h += '<div class="big">' + got + "<small> / 50 correct · " + done + " answered</small></div>";
    h += '<div class="stats">' + LEVELS.map(lv => {
      const items = ITEMS.filter(i => i.difficulty === lv), g = items.filter(i => isCorrect(i.id)).length, d = items.filter(i => answered(i.id)).length;
      return '<div class="stat"><strong>' + g + " / " + items.length + "</strong><span>" + LEVEL_NAME[lv] + " · " + d + " answered</span></div>";
    }).join("") + "</div>";
    h += '<div><p class="label">By module</p><div class="mod-bars">' + MODULES.map(m => {
      const items = ITEMS.filter(i => i.module === m), g = items.filter(i => isCorrect(i.id)).length, d = items.filter(i => answered(i.id)).length;
      return '<div class="mod-bar"><span>' + esc(m) + "</span><em>" + g + "/" + items.length + '</em><div class="bar"><i class="b-ok" style="width:' + (g / items.length * 100) + '%"></i><i class="b-bad" style="width:' + ((d - g) / items.length * 100) + '%"></i></div></div>';
    }).join("") + "</div></div>";
    h += '<div><p class="label">Answered wrong (' + wrong.length + ")</p>" + (wrong.length ? '<div class="wrong-list">' + wrong.map(i => '<button type="button" data-go="' + i.id + '">Q' + i.id + " · " + esc(i.concept) + "</button>").join("") + "</div>" : "<p>None so far.</p>") + "</div>";
    h += '<div class="row-actions"><button type="button" class="btn primary" data-act="retry"' + (wrong.length ? "" : " disabled") + ">Retry wrong answers</button>" +
      '<button type="button" class="btn" data-act="start">Back to questions</button>' +
      '<button type="button" class="btn danger" data-act="reset" id="resetBtn">Reset all progress</button></div>';
    h += '<div class="sheet"><p class="label">Cheat sheet: all 50 recaps</p>' + MODULES.map(m =>
      "<div><h3>" + esc(m) + "</h3><ol>" + ITEMS.filter(i => i.module === m).map(i => '<li value="' + i.id + '">' + esc(i.recap) + "</li>").join("") + "</ol></div>").join("") + "</div>";
    $("main").innerHTML = h;
  }

  function update(focus) {
    if (state.view === "item") renderItem();
    else if (state.view === "recap") renderRecap();
    else renderResults();
    renderRail();
    save();
    if (focus) { $("main").focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: "auto" }); }
  }

  function setMode(mode) {
    state.mode = mode;
    const ids = list();
    if (!ids.includes(state.current)) state.current = ids.find(id => !answered(id)) || ids[0];
    state.view = "item";
    update(true);
  }

  function answer(i) {
    const it = byId[state.current];
    if (state.view !== "item" || answered(it.id) || i < 0 || i > 3) return;
    state.answers[it.id] = i;
    update(false);
    const fb = document.querySelector(".feedback");
    if (fb && window.innerWidth < 900) fb.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  let resetArmed = false;
  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.opt !== undefined) return answer(+t.dataset.opt);
    if (t.dataset.go) { if (!list().includes(+t.dataset.go)) state.mode = "all"; state.current = +t.dataset.go; state.view = "item"; $("rail").classList.remove("open"); return update(true); }
    if (t.dataset.mode) return setMode(t.dataset.mode);
    if (t.dataset.nav === "next") return goNext();
    if (t.dataset.nav === "prev") return goPrev();
    if (t.hasAttribute("data-copy")) {
      const code = byId[state.current].code;
      const pre = t.closest(".code").querySelector("pre");
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected"; };
      try { navigator.clipboard.writeText(code).then(() => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy", 1500); }, fallback); } catch (err) { fallback(); }
      return;
    }
    if (t.id === "resultsBtn") { state.view = "results"; return update(true); }
    if (t.id === "railToggle") { const r = $("rail"); r.classList.toggle("open"); t.setAttribute("aria-expanded", r.classList.contains("open")); return; }
    const act = t.dataset.act;
    if (act === "continue") { const nextLv = LEVELS[LEVELS.indexOf(state.recapLevel) + 1]; state.current = ITEMS.find(i => i.difficulty === nextLv).id; state.view = "item"; return update(true); }
    if (act === "results") { state.view = "results"; return update(true); }
    if (act === "review") { state.mode = state.recapLevel; state.current = ITEMS.find(i => i.difficulty === state.recapLevel).id; state.view = "item"; return update(true); }
    if (act === "start") { state.view = "item"; if (!list().includes(state.current)) state.mode = "all"; return update(true); }
    if (act === "retry") {
      const wrong = ITEMS.filter(i => answered(i.id) && !isCorrect(i.id)).map(i => i.id);
      if (!wrong.length) return;
      wrong.forEach(id => delete state.answers[id]);
      state.retryIds = wrong; state.mode = "retry"; state.current = wrong[0]; state.view = "item";
      return update(true);
    }
    if (act === "reset") {
      if (!resetArmed) { resetArmed = true; t.classList.add("armed"); t.textContent = "Tap again to erase everything"; setTimeout(() => { resetArmed = false; if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Reset all progress"; } }, 3000); return; }
      resetArmed = false;
      state = { answers: {}, current: 1, mode: "all", retryIds: [], view: "item", recapLevel: null };
      return update(true);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest("input, textarea")) return;
    const k = e.key.toLowerCase();
    const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map && state.view === "item") { e.preventDefault(); answer(map[k]); }
    else if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  });

  update(false);
})();
</script>
